{% extends 'layouts/base.html' %}

{% block content %}

<h1>Task 2 - Publishers Book Count</h1>

<table border="1">
    <tr>
        <th>Publisher</th>
        <th>Total Books</th>
    </tr>

    {% for pub in publishers %}
    <tr>
        <td>{{ pub.name }}</td>
        <td>{{ pub.total_books }}</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
