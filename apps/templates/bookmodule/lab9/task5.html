{% extends 'layouts/base.html' %}

{% block content %}

<h1>Task 5 - Highly Rated Books Count</h1>

<table border="1">
    <tr>
        <th>Publisher</th>
        <th>Highly Rated Books</th>
    </tr>

    {% for pub in publishers %}

        <td>{{ pub.name }}</td>
        <td>{{ pub.highly_rated_books }}</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
