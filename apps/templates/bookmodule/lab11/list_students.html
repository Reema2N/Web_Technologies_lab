<h1>Students List</h1>
<a href="{% url 'logout' %}">Logout</a>
<a href="{% url 'add_student' %}">
    Add Student
</a>

<hr>

{% for student in students %}

    <h3>{{ student.name }}</h3>

    <p>Age: {{ student.age }}</p>

    <p>Address: {{ student.address }}</p>

    <a href="{% url 'edit_student' student.id %}">
        Edit
    </a>

    <a href="{% url 'delete_student' student.id %}">
        Delete
    </a>

    <hr>

{% endfor %}
